# Netlify static deploy
# Base directory in UI: website  OR  set base = "website" from monorepo root

[build]
  base = "website"
  command = "npm ci && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Next export already emits 404.html
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
